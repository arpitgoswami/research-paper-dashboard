<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0908" />
    <meta
      name="description"
      content="A quiet proof sheet for tracking every section of an MTech review paper, from title to presentation."
    />
    <title>MTech review paper</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0908'/%3E%3Cpath d='M8 24V8h2.6l5.4 9 5.4-9H24v16h-2.4V12.4L16.8 21h-.6L11.2 12.4V24Z' fill='%23d8a441'/%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter+Tight:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="root" class="app">
      <div class="stage">
        <header class="bar">
          <span class="brand">MTech review</span>
          <span class="bar-count" id="barCount"></span>
        </header>

        <div class="pager" id="pager">
          <section class="screen is-active" aria-label="Overview">
            <div class="body">
              <div class="head">
                <p class="kicker" id="kicker"></p>
                <input class="title inline" id="paperTitle" aria-label="Paper title" />
                <input class="subtitle inline" id="paperSubtitle" aria-label="Paper subtitle" />

                <label class="deadline">
                  <span data-icon="calendar-days" data-size="14"></span>
                  <input type="date" id="deadline" aria-label="Submission deadline" />
                  <span class="hint" id="deadlineHint"></span>
                </label>
              </div>

              <div id="overviewMeta"></div>
            </div>
          </section>

          <section class="screen" aria-label="Sections">
            <div class="subbar">
              <div class="seg" id="filters" role="group" aria-label="Filter sections"></div>
              <button class="icon" data-action="add" aria-label="Add section" title="Add section">
                <span data-icon="plus" data-size="16"></span>
              </button>
            </div>
            <div class="body list" id="rows"></div>
          </section>

          <section class="screen" aria-label="Focus">
            <div class="body">
              <p class="kicker">Music</p>
              <div class="viz" id="viz" aria-hidden="true"></div>
              <div class="now">
                <strong id="nowName"></strong>
                <span id="nowMeta"></span>
              </div>

              <div class="track-list" id="trackList"></div>

              <div class="controls">
                <button class="btn accent" id="playBtn"></button>
                <label class="volume">
                  <span id="volumeIcon"></span>
                  <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.05"
                    id="volume"
                    aria-label="Music volume"
                  />
                </label>
              </div>

              <p class="kicker spaced">Your data</p>
              <p class="muted small" id="savedNote"></p>
              <div class="controls">
                <button class="btn" id="exportBtn">
                  <span data-icon="download" data-size="15"></span>
                  Export JSON
                </button>
                <button class="btn quiet" id="resetBtn">
                  <span data-icon="rotate-ccw" data-size="15"></span>
                  Reset
                </button>
              </div>
            </div>
          </section>
        </div>

        <nav class="tabs" aria-label="Screens">
          <button class="tab-arrow" id="prevBtn" aria-label="Previous screen">
            <span data-icon="arrow-left" data-size="16"></span>
          </button>
          <div class="dots" id="dots"></div>
          <button class="tab-arrow" id="nextBtn" aria-label="Next screen">
            <span data-icon="arrow-right" data-size="16"></span>
          </button>
        </nav>

        <div class="autoplay" aria-hidden="true">
          <div class="autoplay-fill" id="autoplayFill"></div>
        </div>

        <div id="editorMount"></div>
      </div>
    </div>

    <script src="./app.js" defer></script>
  </body>
</html>
